name: minecraft-platform-workers

# Workers connect to Postgres, Redis, MinIO and Meilisearch created by the
# main `docker-compose.yml`. Run both stacks simultaneously:
#   docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.services.yml up

services:
  upload-worker:
    build:
      context: .
      dockerfile: services/upload-worker/Dockerfile
    container_name: mcp-upload-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # H-I2: Redis now requires a password (set in docker-compose.yml via
      # `--requirepass`). Without this env the worker AUTH-errors against the
      # queue and the hardening we just added looks like "Redis is down".
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    # C29: gate startup on `service_healthy` so a worker doesn't boot and
    # fail-loop against a Redis that's still copying the RDB off disk, or a
    # MinIO still loading. Healthchecks are declared in the main
    # docker-compose.yml on the postgres/redis/minio/meilisearch/clamav
    # services; without condition gating, the short-form `depends_on` only
    # waits for the container to exist, not for it to actually serve.
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend
    # H-I3: workers don't need any Linux capabilities, so drop everything and
    # deny privilege escalation. `init:true` ensures BullMQ's signal handlers
    # receive SIGTERM from the orchestrator (otherwise the dumb-init-less
    # Node PID 1 shell swallows it and graceful shutdown never runs).
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

  image-processor:
    build:
      context: .
      dockerfile: services/image-processor/Dockerfile
    container_name: mcp-image-processor
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256

  virus-scanner:
    build:
      context: .
      dockerfile: services/virus-scanner/Dockerfile
    container_name: mcp-virus-scanner
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # REQUIRED: the worker writes scanStatus (CLEAN/INFECTED/ERROR) back to
      # Postgres. Without this it would fall back to the compiled-in default
      # (localhost:5432) and every DB write would silently fail.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-minecraft_platform}
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      # backend: redis/clamav/postgres. egress: Modrinth-imported versions are
      # scanned from their CDN URL (remoteUrl jobs); the backend network is
      # internal by design, so outbound is granted here only.
      - backend
      - egress
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 256

  search-indexer:
    build:
      context: .
      dockerfile: services/search-indexer/Dockerfile
    container_name: mcp-search-indexer
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-minecraft_platform}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 384M
          pids: 256

  analytics-worker:
    build:
      context: .
      dockerfile: services/analytics-worker/Dockerfile
    container_name: mcp-analytics-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-minecraft_platform}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    container_name: mcp-notification-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-minecraft_platform}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@minecraftplatform.com}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      # backend: redis/postgres. egress: outbound SMTP delivery — the backend
      # network is internal by design, so outbound is granted here only.
      - backend
      - egress
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 256

networks:
  backend:
    name: minecraft-platform_backend
    external: true
  egress:
    name: minecraft-platform_egress
    external: true
