# Dependabot keeps dependencies current and surfaces patched advisories.
# Re-evaluate the npm schedule after rolling out a hotfix train.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      next:
        patterns: ["next", "next-*", "eslint-config-next", "@next/*"]
      nest:
        patterns: ["@nestjs/*", "nest-*"]
      prisma:
        patterns: ["@prisma/*", "prisma"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "@testing-library/react*"]
      aws:
        patterns: ["@aws-sdk/*"]
      dev-build:
        patterns: ["typescript", "ts-node", "vitest", "vite", "turbo", "prettier", "eslint", "@typescript-eslint/*"]
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
      include: scope
    labels: ["dependencies", "docker"]
