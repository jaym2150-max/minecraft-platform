name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      # Generate the Prisma client before lint: worker-service `tsc --noEmit`
      # imports `PrismaClient` from @prisma/client, which only exists after
      # `prisma generate` (needs no live DB).
      - run: pnpm --filter @mcp/api db:generate
      - run: pnpm format:check
      - run: pnpm lint
