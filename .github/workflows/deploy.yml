name: Deploy

# Deploy only runs after the CI workflow completes successfully on `main`.
# `workflow_run` is the recommended cross-workflow gate (a `needs:` reference
# only works within the same workflow file). The downstream `if` re-checks the
# branch and the conclusion in case the upstream workflow is re-run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      contents: read
      packages: write # required to push to GHCR with the built-in GITHUB_TOKEN
    env:
      # Images live in GitHub Container Registry under this repo's namespace,
      # e.g. ghcr.io/jaym2150-max/minecraft-platform/api. GHCR auth uses the
      # workflow's built-in GITHUB_TOKEN — no registry username/token secrets
      # to manage (the previous docker.io setup needed DOCKER_REGISTRY_USER /
      # DOCKER_REGISTRY_TOKEN).
      REGISTRY: ghcr.io
      IMAGE_API: ghcr.io/${{ github.repository }}/api
      IMAGE_WEB: ghcr.io/${{ github.repository }}/web
      # Infra steps self-skip until these repo secrets exist, so image
      # build/push works before production infra is provisioned.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      # `workflow_run` runs on the default branch, so we check out the head SHA
      # of the CI run we're gating on, not the workflow's own ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      # The app images referenced by infrastructure/kubernetes/deployment.yaml
      # (api, web) are built from their per-app Dockerfiles with the repo root
      # as build context. The root docker-compose.yml is infra-only (postgres,
      # redis, minio, meilisearch, clamav, mailpit, nginx) and has no app build
      # contexts.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app images
        run: |
          docker build -t "$IMAGE_API:latest" -f apps/api/Dockerfile .
          docker build -t "$IMAGE_WEB:latest" -f apps/web/Dockerfile .
          docker push "$IMAGE_API:latest"
          docker push "$IMAGE_WEB:latest"

      # GHCR packages default to private; the deployments (and any external
      # puller) must be able to pull anonymously, matching the public repo.
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in api web; do
            gh api -X PATCH "/user/packages/container/${{ github.event.repository.name }}%2F${pkg}" -f visibility=public \
              || echo "::warning::Could not set ${pkg} visibility via API — if pulls 401, set it public at https://github.com/users/${{ github.event.repository.owner.login }}/packages"
          done

      - name: Scan images for vulnerabilities (trivy, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.IMAGE_API }}:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Run database migrations
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm --filter api db:migrate:prod

      - name: Deploy to Kubernetes
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: steebchen/kubectl@v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: apply -f infrastructure/kubernetes/

      - name: Verify deployment
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: steebchen/kubectl@v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/api -n minecraft-platform
