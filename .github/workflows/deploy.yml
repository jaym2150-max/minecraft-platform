name: Deploy

# Deploy only runs after the CI workflow completes successfully on `main`.
# `workflow_run` is the recommended cross-workflow gate (a `needs:` reference
# only works within the same workflow file). The downstream `if` re-checks the
# branch and the conclusion in case the upstream workflow is re-run.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    env:
      REGISTRY: ${{ vars.DOCKER_REGISTRY || 'mcp' }}
    steps:
      # `workflow_run` runs on the default branch, so we check out the head SHA
      # of the CI run we're gating on, not the workflow's own ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Build applications
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter api db:migrate:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The app images referenced by infrastructure/kubernetes/deployment.yaml
      # (api, web) are built from their per-app Dockerfiles with the repo root
      # as build context. The root docker-compose.yml is infra-only (minio,
      # meilisearch, redis, clamav, mailpit) and has no app build contexts —
      # `docker compose build` against it produces nothing, which is what this
      # step used to do.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY_HOST || 'docker.io' }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build & push app images
        run: |
          docker build -t "$REGISTRY/api:latest" -f apps/api/Dockerfile .
          docker build -t "$REGISTRY/web:latest" -f apps/web/Dockerfile .
          docker push "$REGISTRY/api:latest"
          docker push "$REGISTRY/web:latest"

      - name: Scan images for vulnerabilities (trivy, fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/api:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Deploy to Kubernetes
        uses: steebchen/kubectl@v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: apply -f infrastructure/kubernetes/

      - name: Verify deployment
        uses: steebchen/kubectl@v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/api -n minecraft-platform
