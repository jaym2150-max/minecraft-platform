name: CodeQL

# Static analysis for TS/JS security rules. Complements CI's lint/typecheck
# and the deploy-time trivy image scan. Free for public repos; for private
# repos confirm GitHub Advanced Security is enabled.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1"

jobs:
  analyze:
    name: Analyze (TS/JS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
