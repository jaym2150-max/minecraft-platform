# Minecraft Platform — Nginx Configuration
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Enhanced rate limiting zones
    # General API: 10 requests per second per IP (more restrictive)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
    
    # Auth endpoints: stricter limits
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    
    # Registration endpoints: very strict
    limit_req_zone $binary_remote_addr zone=api_register:10m rate=2r/m;
    
    # Password reset: moderate
    limit_req_zone $binary_remote_addr zone=api_reset:10m rate=3r/m;
    
    # 2FA operations: moderate
    limit_req_zone $binary_remote_addr zone=api_2fa:10m rate=5r/m;
    
    # File uploads: very restrictive
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=1r/m;
    
    # Login endpoint: very strict
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

    # Upstreams. C26/C32: target the docker-compose service hostnames on
    # the shared `frontend`/`backend` networks rather than
    # `host.docker.internal:3000` (which silently drifts: the web app runs on
    # port 3003 per package.json/README, but the previous upstream used
    # 3000, so every nginx-proxied web route hit a closed port). With the
    # service-name DNS the port is whatever the per-service EXPOSE / published
    # upstream is, and cross-host resolution is handled by Docker Compose
    # network aliases automatically. The `host.docker.internal` escape hatch
    # remains available by configuring `extra_hosts` on the nginx service in
    # docker-compose.yml for dev-from-host workflows.
    upstream web {
        server web:3003;
    }

    upstream api {
        server api:4000;
    }

    upstream admin {
        server admin:3001;
    }

    upstream minio_console {
        server minio:9001;
    }

    # Enhanced rate limiting for different endpoint types
    server {
        listen 80;
        server_name localhost;

        # SECURITY: baseline security headers on every edge response. The
        # API's helmet sets these on direct-origin responses; nginx sits in
        # front and its responses must not regress to no-headers status.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        # SECURITY: cap request body to 60MB so an attacker cannot drive
        # memory exhaustion by streaming a multi-GB body through the edge
        # to upstream. Matches the API's 50MB cap with headroom.
        client_max_body_size 60m;
        client_body_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Web App
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - Enhanced routing with specific rate limits
        location /api/ {
            # Apply general API rate limiting first
            limit_req zone=api_general burst=20 nodelay;
            limit_req_status 429;
            
            # More specific routing could be done here with map or additional location blocks
            # For now, we'll rely on the general limit and endpoint-specific limits in NestJS
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints with specific rate limiting
        location /api/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Registration endpoints
        location /api/auth/register {
            limit_req zone=api_register burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Password reset endpoints
        location ~ /api/auth/(forgot-password|reset-password) {
            limit_req zone=api_reset burst=3 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2FA endpoints
        location ~ /api/auth/(2fa/) {
            limit_req zone=api_2fa burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Upload endpoints
        location /api/uploads/ {
            limit_req zone=api_upload burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Panel
        location /admin/ {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NOTE: /search/ (Meilisearch) and /minio/ (MinIO console) were
        # previously proxied here with NO auth barrier. With an empty
        # MEILISEARCH_API_KEY and the admin MinIO root creds, that exposed the
        # search index and object store to anyone who could reach nginx. They
        # are data-plane/admin services and must NOT be publicly routable.
        # Reach them on the backend network (or VPN) only; if a console must be
        # exposed, gate it behind auth_basic / an IP allowlist in a separate
        # server block, never the public one.
    }

