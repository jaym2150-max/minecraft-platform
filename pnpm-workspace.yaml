packages:
  - 'apps/*'
  - 'packages/*'
  - 'services/*'

# NOTE: dependency overrides live in the root package.json under
# `pnpm.overrides`. That is the location pnpm 9 (packageManager: pnpm@9.15.4)
# reads. The `overrides:` key here is only honored by pnpm 10+/11+, so do NOT
# add overrides in this file — they will be silently ignored by the pinned pnpm.

