packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# pnpm 11+ ignores `pnpm.overrides` in package.json; moved here.
# Deduplicated: one widest range per package (was 20+ overlapping ranges).
overrides:
  "path-to-regexp@>=0.2.0 <1.9.0": ">=1.9.0"
  "tmp@<0.2.6": ">=0.2.6"
  "nodemailer@<=9.0.0": ">=9.0.1"
  "glob@>=10.2.0 <10.5.0": ">=10.5.0"
  "webpack@<5.104.1": ">=5.104.1"
  "multer@<2.2.0": ">=2.2.0"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0"
  "file-type@<21.3.2": ">=21.3.2"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4"
  "lodash@<4.18.0": ">=4.18.0"
  "postcss@<8.5.10": ">=8.5.10"
  "@nestjs/core@>=11.0.0 <=11.1.17": ">=11.1.18"
  "qs@>=6.11.1 <=6.15.1": ">=6.15.2"
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6"
  "vite@<8.0.16": ">=8.0.16"
  "js-yaml@<=4.1.1": ">=4.2.0"
  "@babel/core@<=7.29.0": ">=7.29.6"
  "undici@<7.28.0": ">=7.28.0"
