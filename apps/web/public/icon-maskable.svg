    </g>
    <g fill="#7d6449" stroke="#3b2417" stroke-width="4" stroke-linejoin="round">
      <rect x="0" y="180" width="36" height="36"/>
      <rect x="0" y="220" width="36" height="36"/>
      <rect x="0" y="260" width="36" height="36"/>
