name: minecraft-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      # H-I6: SESSION_TTL_SECONDS is an app-only value. It leaked into the
      # Postgres/Meili/MinIO service env blocks in the initial scaffold and
      # confused operators into thinking it applied to those services.
      # Removed — the API reads it directly from the app's own env.
      # SECURITY: no fallback defaults here. A prod operator who forgets to
      # populate the .env would otherwise boot Postgres with the hardcoded
      # `mcp`/`mcp` credentials (a known-public value). The deliberately
      # missing default forces `docker compose up` to error with "POSTGRES_*"
      # not set rather than silently running with known creds. Dev users get
      # the same defaults via docker/minio-style committed `.env` overrides.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env — see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-minecraft_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Postgres needs to manage shared memory for its worker pools.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    # H-I2: require a password even in dev so a process on the host (or
    # another container on the bridge) can't read/write the queue without a
    # credential. The redis.conf ships with `requirepass` intentionally
    # commented out so the canonical value comes from env (a single source
    # of truth) and is never committed. `${VAR:?...}` fails fast if unset.
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env — see .env.example}"
    # H-I3: harden the container — drop all capabilities, deny privilege
    # escalation, mark the filesystem read-only so a compromised process
    # can't persist binaries/cover its tracks, and add a tmpfs for the only
    # writable paths Redis actually needs. `init:true` forwards signals so
    # a SIGTERM to the pod reliably stops Redis (not just PID 1's shell).
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 256
        reservations:
          memory: 128M

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: mcp-meilisearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:?MEILISEARCH_API_KEY must be set in .env — see .env.example}
      MEILI_ENV: ${NODE_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
        reservations:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: mcp-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env — see .env.example}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env — see .env.example}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 1G
          pids: 256
        reservations:
          memory: 256M

  clamav:
    # 1.4.x patch tags get purged upstream once EOL; the minor tag tracks the
    # current 1.4 release (same "practical floor" policy as nginx above).
    image: clamav/clamav:1.4
    container_name: mcp-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # ClamAV needs DAC_OVERRIDE to manage its signature DB ownership; it
    # never needs NET_ADMIN / SYS_ADMIN / the rest of the default set.
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 2G
          pids: 256
        reservations:
          memory: 512M

  nginx:
    profiles: ["prod"]
    # C25: pin a specific nginx minor on alpine instead of the rolling
    # `:alpine` tag so a `docker compose pull` after an upstream rebuild can't
    # silently swap in a newer nginx with a behavior change / CVE delta. The
    # audit's intent here is the same as the `@sha256:` digest pinning we
    # apply to the platform images — for the third-party base images a
    # version tag is the practical floor until we cut digest pins at release.
    image: nginx:1.27-alpine
    container_name: mcp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # C26: `extra_hosts` makes `host.docker.internal` resolve from inside
    # the container so the upstream config can target apps that are run on
    # the host (via `pnpm dev`) for dev — or the in-network service names
    # (`web`/`api`/`admin`) for prod-in-compose, which resolve via the
    # shared `frontend` network aliases below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx needs net_bind_service to bind ports <1024 (80/443) and
    # chown/dac_override to read the mounted certs and write its temp
    # dirs; everything else from the default privilege set is dropped.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    networks:
      - frontend
    depends_on:
      - minio
      - meilisearch
    deploy:
      resources:
        limits:
          memory: 128M
          pids: 256

networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
   postgres_data:
   redis_data:
   meilisearch_data:
   minio_data:
   clamav_data:
