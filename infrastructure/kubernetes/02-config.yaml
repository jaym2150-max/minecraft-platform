apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: minecraft-platform
data:
  NODE_ENV: "production"
  API_PORT: "4000"
  RATE_LIMIT_TTL: "60"
  RATE_LIMIT_MAX: "100"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
# Same for other apps
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: minecraft-platform
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.minecraftplatform.com/api/v1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-config
  namespace: minecraft-platform
data:
  NODE_ENV: "production"
