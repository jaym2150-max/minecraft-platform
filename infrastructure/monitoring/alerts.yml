groups:
  - name: api_alerts
    rules:
      # D7 (AUDIT.md): tighten the previously-lenient thresholds. The old
      # config (5xx > 0.1 req/s for 5min; latency p95 > 1s for 5min) tolerated
      # a sustained 30+ errors per 5min window and a 1s p95 for 5 full
      # minutes before paging — both long enough that customer-visible
      # outages happened before anyone saw the alert. We now alert at
      # half the previous rate / duration.
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High API error rate"
          description: "API is returning 5xx errors at {{ $value }} req/s"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency (p95 > 500ms)"
          description: "95th percentile latency is {{ $value }}s"

      - alert: APIDown
        expr: up{job="api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API is down"
          description: "API has been unreachable for 30 seconds"

  - name: database_alerts
    rules:
      - alert: DatabaseConnectionsHigh
        expr: pg_stat_activity_count > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection pool near limit"
          description: "{{ $value }} active connections"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

  - name: worker_alerts
    rules:
      - alert: QueueBacklog
        expr: bullmq_jobs_waiting > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog growing"
          description: "{{ $value }} jobs waiting in {{ $labels.queue }}"

      - alert: WorkerDown
        expr: up{job=~".*-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Worker {{ $labels.job }} is down"

  - name: storage_alerts
    rules:
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% disk space remaining"
          description: "Mountpoint {{ $labels.mountpoint }} is {{ $value }}% full"
